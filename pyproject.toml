[project]
name = "jobs"
version = "0.1.0"
description = "Adam's automatic job-application harness"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
jobs = "core.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.11.5,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "core"
